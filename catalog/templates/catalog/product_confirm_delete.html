{% extends 'catalog/base.html' %}
{% block title %}Удалить товар{% endblock %}
{% block page_title %}Удалить товар{% endblock %}

{% block content %}
<form method="post" class="card card-body">
    {% csrf_token %}
    <p>Удалить «{{ object.name }}»?</p>
    <button class="btn btn-danger" type="submit">Удалить</button>
    <a class="btn btn-link" href="{{ object.get_absolute_url }}">Отмена</a>
</form>
{% endblock %}
