{% load static %}

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Mailings{% endblock %}</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f4f7fb;
        }
        header {
            background: #0d6efd;
            color: white;
            padding: 15px 0;
        }
        header a {
            color: white !important;
        }
        .mailing-card {
            border-radius: 10px;
            background: white;
            padding: 25px;
            box-shadow: 0 0 10px rgba(0,0,0,.05);
            margin-bottom: 25px;
        }
    </style>

</head>
<body>

<header>
    <div class="container d-flex justify-content-between align-items-center">
        <h3 class="m-0">📨 Сервис рассылок</h3>

        <nav>
            <a class="btn btn-light btn-sm me-2" href="{% url 'mailings:client_list' %}">Получатели</a>
            <a class="btn btn-light btn-sm me-2" href="{% url 'mailings:message_list' %}">Сообщения</a>
            <a class="btn btn-light btn-sm me-2" href="{% url 'mailings:mailing_list' %}">Рассылки</a>
            <a class="btn btn-light btn-sm me-3" href="{% url 'mailings:attempt_list' %}">Попытки</a>

            <a class="btn btn-outline-light btn-sm" href="{% url 'catalog:home' %}">← Вернуться в магазин</a>
        </nav>
    </div>
</header>

<main class="container my-4">
    <h1 class="mb-4">{% block page_title %}Раздел рассылок{% endblock %}</h1>

    {% block content %}{% endblock %}
</main>


<footer class="text-center text-muted py-3">
    SkyStore Mailings © {{ now|date:"Y" }}
</footer>

</body>
</html>
